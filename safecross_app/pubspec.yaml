name: safecross_app
description: SafeCross — Asistencia visual para cruzar calles de forma segura.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Cámara
  camera: ^0.10.5+9

  # HTTP para llamar a la API
  http: ^1.2.1

  # Permisos en runtime
  permission_handler: ^11.3.1

  # Texto a voz (feedback de audio para personas con discapacidad visual)
  flutter_tts: ^4.0.2

  # Guardar URL del servidor entre sesiones
  shared_preferences: ^2.2.3

  # Iconos extra
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
