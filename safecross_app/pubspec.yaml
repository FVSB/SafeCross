name: safecross_app
description: SafeCross — Asistencia visual para cruzar calles de forma segura.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Cámara
  camera: ^0.10.5+9

  # Inferencia YOLOv8 local con TFLite (sin internet)
  flutter_vision: ^6.0.0

  # Permisos en runtime
  permission_handler: ^11.3.1

  # Texto a voz (feedback de audio para personas con discapacidad visual)
  flutter_tts: ^4.0.2

  # Iconos extra
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # Etiquetas de clases para cada modelo
    - assets/labels/lights.txt
    - assets/labels/crosswalks.txt
    # Modelos TFLite (generados con scripts/export_tflite.py)
    - assets/models/lights.tflite
    - assets/models/crosswalks.tflite
